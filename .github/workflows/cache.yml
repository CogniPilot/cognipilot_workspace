name: Warm project Nix cache

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-project-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Build cacheable project outputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: cachix-write

    steps:
      - name: Reclaim runner disk for Nix outputs
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # Nix 2.35.1
        with:
          github_access_token: ${{ github.token }}
          install_options: --no-daemon

      - name: Configure binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Install Devenv
        run: >-
          nix profile add
          github:cachix/devenv/407080febcc800abfd0fd688a0d513884aad620c#packages.x86_64-linux.default

      - name: Prepare release profile evaluators
        run: |
          devenv --profile release print-paths
          devenv --profile fastdyn print-paths

      # Remove when Devenv links Nix >= 2.35: https://github.com/cachix/devenv/issues/2729
      - name: Evaluate release packages with host Nix
        run: |
          DEVENV_PROFILE=release nix eval --impure --file devenv/host-eval.nix --json >/dev/null
          DEVENV_PROFILE=fastdyn nix eval --impure --file devenv/host-eval.nix --json >/dev/null

      - name: Synchronize pinned projects
        run: devenv --profile release tasks run sources:sync

      - name: Realize complete tool environments
        run: |
          devenv --profile release build shell
          devenv --profile fastdyn build shell

      - name: Realize project flake outputs
        run: devenv --profile release tasks run cache:all
