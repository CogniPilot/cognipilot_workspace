name: Devenv workspace CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: devenv-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Devenv (${{ matrix.system }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # Nix 2.35.1
        with:
          github_access_token: ${{ github.token }}
          install_options: ${{ runner.os == 'Linux' && '--no-daemon' || '' }}

      - name: Configure public binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) }}

      - name: Install Devenv
        run: >-
          nix profile add
          github:cachix/devenv/407080febcc800abfd0fd688a0d513884aad620c#packages.${{ matrix.system }}.default

      - name: Test the canonical workspace
        run: devenv --profile ci test

      - name: Evaluate every supported profile
        shell: bash
        run: |
          set -euo pipefail
          for profile in \
            ci cubs2 diagnostics fastdyn modelica ppm qualisys rdd2 release \
            ros2 rust synapse web workspace zephyr zros
          do
            devenv --profile "$profile" eval packages >/dev/null
          done
