name: Devenv workspace CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devenv-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Devenv (${{ matrix.system }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Configure public binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Install Devenv
        run: >-
          nix profile add
          github:cachix/devenv/407080febcc800abfd0fd688a0d513884aad620c#packages.${{ matrix.system }}.default

      - name: Test the canonical workspace
        run: devenv --profile ci test

      - name: Evaluate every supported profile
        shell: bash
        run: |
          set -euo pipefail
          for profile in \
            cubs2 rdd2 ground-station simulation modelica qualisys \
            zros ros2 ppm fastdyn diagnostics release rust web zephyr
          do
            devenv --profile "$profile" eval packages >/dev/null
          done
