name: Publish workspace container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-workspace-container-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVENV_REF: 8f297eae651cb47fb1e8f7c19b942462aa879636

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must have the form vX.Y.Z" >&2
            exit 1
          fi

      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # Nix 2.35.1
        with:
          github_access_token: ${{ github.token }}
          install_options: --no-daemon

      - name: Configure binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Install Devenv
        run: nix profile add github:cachix/devenv/${{ env.DEVENV_REF }}#packages.x86_64-linux.default

      - name: Prepare the CI profile evaluator
        run: devenv --profile ci print-paths

      # Remove when Devenv links Nix >= 2.35: https://github.com/cachix/devenv/issues/2729
      - name: Evaluate CI packages with host Nix
        env:
          DEVENV_PROFILE: ci
        run: nix eval --impure --file devenv/host-eval.nix --json >/dev/null

      - name: Test workspace configuration
        run: devenv --profile ci test

  qualify:
    name: Qualify ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Synapse release
            profile: release
            tasks: release:synapse-fbs release:compliance
          - name: Modelica release
            profile: release
            tasks: release:rumoca release:modelica-models
          - name: Electrode
            profile: release
            tasks: release:electrode-web
          - name: Qualisys
            profile: release
            tasks: release:qualisys-sdk release:qualisys-bridge
          - name: PPM bridge
            profile: release
            tasks: release:ppm
          - name: Zephyr libraries
            profile: release
            tasks: cerebri-modules:test zros:test release:csyn
          - name: CUBS2 native 64-bit
            profile: cubs2
            tasks: cubs2:simulation:sil:test
          - name: CUBS2 pure Modelica
            profile: cubs2
            tasks: cubs2:simulation:modelica:test
          - name: CUBS2 native 32-bit
            profile: cubs2
            tasks: cubs2:simulation:sil:build-32
          - name: CUBS2 hardware
            profile: cubs2
            tasks: cubs2:firmware:build
          - name: RDD2 native
            profile: rdd2
            tasks: rdd2:simulation:sil:build
          - name: RDD2 hardware
            profile: rdd2
            tasks: rdd2:firmware:build
          - name: ROS 2 bridge
            profile: ros2
            tasks: ros2:test
          - name: FastDyn
            profile: fastdyn
            tasks: fastdyn:test

    steps:
      - name: Reclaim runner disk for project builds
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # Nix 2.35.1
        with:
          github_access_token: ${{ github.token }}
          install_options: --no-daemon

      - name: Configure binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Install Devenv
        run: nix profile add github:cachix/devenv/${{ env.DEVENV_REF }}#packages.x86_64-linux.default

      - name: Prepare the selected profile evaluator
        run: devenv --profile ${{ matrix.profile }} print-paths

      # Remove when Devenv links Nix >= 2.35: https://github.com/cachix/devenv/issues/2729
      - name: Evaluate selected profile packages with host Nix
        env:
          DEVENV_PROFILE: ${{ matrix.profile }}
        run: nix eval --impure --file devenv/host-eval.nix --json >/dev/null

      - name: Synchronize current project main branches
        run: devenv --profile ${{ matrix.profile }} tasks run sources:sync

      - name: Run Devenv qualification tasks
        run: devenv --profile ${{ matrix.profile }} tasks run ${{ matrix.tasks }}

  container:
    name: Build and publish ${{ github.ref_name }}
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTAINERS_REGISTRIES_CONF: ${{ github.workspace }}/.github/containers-registries.conf

    steps:
      - name: Reclaim runner disk for the OCI closure
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Check out the workspace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # Nix 2.35.1
        with:
          github_access_token: ${{ github.token }}
          install_options: --no-daemon

      - name: Configure binary caches
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: cognipilot
          extraPullNames: devenv,ros
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Install Devenv
        run: nix profile add github:cachix/devenv/${{ env.DEVENV_REF }}#packages.x86_64-linux.default

      - name: Prepare the workspace profile evaluator
        run: devenv --profile workspace print-paths

      # Remove when Devenv links Nix >= 2.35: https://github.com/cachix/devenv/issues/2729
      - name: Evaluate workspace packages with host Nix
        env:
          DEVENV_PROFILE: workspace
        run: nix eval --impure --file devenv/host-eval.nix --json >/dev/null

      - name: Build workspace container
        run: devenv --profile workspace container build shell

      - name: Publish versioned container
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          devenv --profile workspace
          --option containers.shell.version:string "$GITHUB_REF_NAME"
          container copy shell
          --copy-args="--dest-creds $GITHUB_ACTOR:$GHCR_TOKEN"

      - name: Publish latest container tag
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          devenv --profile workspace
          container copy shell
          --copy-args="--dest-creds $GITHUB_ACTOR:$GHCR_TOKEN"
