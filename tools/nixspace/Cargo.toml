[package]
name = "nixspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Nix-first workspace meta-client for querying generated plans and delegating to native tools"
documentation = "https://docs.rs/nixspace"
readme = "README.md"
categories = [ "command-line-utilities", "development-tools", "development-tools::build-utils" ]
keywords = [ "nix", "flakes", "workspace", "development-tools" ]
include = [ "src/**", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md" ]

[[bin]]
name = "nixspace"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.5.54", features = [ "derive" ] }
clap_complete = "=4.5.61"
fs4 = { version = "=1.1.0", default-features = false, features = [ "sync" ] }
miette = "=7.6.0"
nix-base32 = "=0.2.0"
serde = { version = "=1.0.228", features = [ "derive" ] }
serde_json = "=1.0.145"
